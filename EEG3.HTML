        h1 { margin-top: 0; }
        .look-btn {
            display: inline-block;

            border-radius: 9999px;
            border: 1px solid #ccc;
            background: #fff;
            color: #333;
            font-size: 15px;
            font-family: inherit;
            letter-spacing: 1px;
            cursor: pointer;
            transition: background .2s ease, transform .15s ease;
        }
        .look-btn:hover { background: #f0f0f0; }
        .look-btn:active { transform: scale(.96); }
        .back-link {
            display: inline-block;
            margin-top: 30px;
            color: #333;
            text-decoration: none;
            border-bottom: 1px solid #999;

        .back-link:hover { color: #000; border-bottom-color: #000; }
