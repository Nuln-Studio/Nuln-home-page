<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>感谢下载 - Nuln Studio</title>
    <link rel="icon" type="image/x-icon" href="2.ico">
    <link rel="stylesheet" href="effects.css">
    <link rel="stylesheet" href="style.css">
    <style>
        .thanks-page {
            max-width: 640px;
            width: 100%;
            margin: 0 auto;
            padding: 120px 20px 60px;
            text-align: center;
            position: relative;
            z-index: 1;
        }
        .thanks-icon {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: #111;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 32px;
        }
        .thanks-icon svg {
            width: 36px;
            height: 36px;
            stroke: #fff;
            stroke-width: 3;
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
        }
        .thanks-title {
            font-size: 32px;
            font-weight: 800;
            letter-spacing: -0.5px;
            color: #111;
            margin-bottom: 12px;
        }
        .thanks-sub {
            font-size: 16px;
            color: #666;
            line-height: 1.8;
            margin-bottom: 36px;
        }
        .thanks-sub strong {
            color: #111;
            font-weight: 600;
        }
        .countdown-wrap {
            position: relative;
            width: 96px;
            height: 96px;
            margin: 0 auto 32px;
        }
        .countdown-wrap svg {
            width: 100%;
            height: 100%;
            display: block;
        }
        .countdown-track {
            fill: none;
            stroke: #f0f0f0;
            stroke-width: 4;
        }
        .countdown-progress {
            fill: none;
            stroke: #111;
            stroke-width: 4;
            stroke-linecap: round;
            transition: stroke-dashoffset 1s linear;
            transform: rotate(-90deg);
            transform-origin: 48px 48px;
        }
        .countdown-num {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 28px;
            font-weight: 800;
            color: #111;
        }
        .thanks-actions {
            display: flex;
            gap: 16px;
            justify-content: center;
            margin-bottom: 32px;
        }
        .btn-ghost {
            padding: 14px 32px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            background: transparent;
            color: #666;
            border: 1px solid #e0e0e0;
            cursor: pointer;
            transition: 0.2s;
        }
        .btn-ghost:hover {
            background: #f5f5f5;
            color: #111;
        }
    </style>
</head>
<body class="layout-centered">
    <canvas id="bg-canvas" aria-hidden="true"></canvas>
    <nav class="navbar">
        <div class="nav-container">
            <a href="index.html" class="nav-logo">
                <img src="2.webp" alt="Nuln Studio" class="nav-logo-img">
                Nuln Studio
            </a>
            <div class="nav-links">
                <a href="portfolio.html" class="nav-link">个人作品集</a>
                <a href="official-repos.html" class="nav-link">官方仓库</a>
                <a href="DownloadInGitHub.html" class="nav-link active">下载产品</a>
            </div>
        </div>
    </nav>

    <div class="thanks-page">
        <div class="thanks-icon">
            <svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"></polyline></svg>
        </div>

        <h1 class="thanks-title">感谢您下载我们的产品</h1>
        <p class="thanks-sub" id="sub-line">
            即将跳转到 <strong id="target-name">GitHub</strong> 下载页<br>
            如果没有自动跳转，请点击下方按钮
        </p>

        <div class="countdown-wrap" id="countdown-wrap">
            <svg viewBox="0 0 96 96" xmlns="http://www.w3.org/2000/svg">
                <circle class="countdown-track" cx="48" cy="48" r="42"/>
                <circle class="countdown-progress" id="ring" cx="48" cy="48" r="42"/>
            </svg>
            <div class="countdown-num" id="countdown">5</div>
        </div>

        <div class="thanks-actions">
            <a id="goto-btn" href="#" class="btn-primary">立即前往 GitHub</a>
            <button id="cancel-btn" class="btn-ghost">取消自动跳转</button>
        </div>
    </div>

    <script src="main.js" defer></script>
    <script>
        (function () {
            var REPOS = {
                'CleanSlate': { mode: 'redirect', url: 'https://github.com/Nuln-Studio/CleanSlate/releases', name: 'CleanSlate', buttonText: '立即前往 GitHub' },
                'CleanSlate.CsGUI': { mode: 'redirect', url: 'https://github.com/Nuln-Studio/CleanSlate.CsGUI/releases', name: 'CleanSlate.CsGUI', buttonText: '立即前往 GitHub' },
                'Nuln-ACT': { mode: 'download', url: 'act/Nuln-ACT-v1.0.8.zip', name: 'Nuln-ACT', buttonText: '立即下载' },
                'Nuln-ACT-Pan': { mode: 'redirect', url: 'https://1841510051.share.123pan.cn/123pan/vLbDTd-l8aX?pwd=nuln', name: '123云盘', buttonText: '立即前往 123云盘', subText: '即将跳转到 <strong>123云盘-下载页</strong><br>提取码：nuln 需要登录账号后下载' }
            };

            function getParam(name) {
                var m = new RegExp('[?&]' + name + '=([^&]*)').exec(location.search);
                return m ? decodeURIComponent(m[1]) : '';
            }

            var repoKey = getParam('repo') || 'CleanSlate';
            var repo = REPOS[repoKey] || REPOS['CleanSlate'];
            var isDownload = repo.mode === 'download';

            document.getElementById('target-name').textContent = repo.name;

            var subLine = document.getElementById('sub-line');
            if (repo.subText) {
                subLine.innerHTML = repo.subText;
            } else if (isDownload) {
                subLine.innerHTML = '即将下载 <strong>' + repo.name + '</strong> 安装包<br>如果没有自动开始，请点击下方按钮';
            } else {
                subLine.innerHTML = '即将跳转到 <strong>' + repo.name + '</strong> 下载页<br>如果没有自动跳转，请点击下方按钮';
            }

            var gotoBtn = document.getElementById('goto-btn');
            gotoBtn.textContent = repo.buttonText;
            gotoBtn.href = repo.url;
            if (isDownload) gotoBtn.setAttribute('download', '');

            function triggerDownload(url) {
                var a = document.createElement('a');
                a.href = url;
                a.download = '';
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
            }

            var TOTAL = 5;
            var remain = TOTAL;
            var canceled = false;

            var countdownEl = document.getElementById('countdown');
            var ringEl = document.getElementById('ring');
            var wrapEl = document.getElementById('countdown-wrap');
            var cancelBtn = document.getElementById('cancel-btn');
            var CIRCUMFERENCE = 2 * Math.PI * 42;

            ringEl.style.strokeDasharray = CIRCUMFERENCE;
            ringEl.style.strokeDashoffset = '0';

            function finish() {
                if (isDownload) {
                    triggerDownload(repo.url);
                    wrapEl.innerHTML = '<svg viewBox="0 0 96 96"><circle cx="48" cy="48" r="42" fill="none" stroke="#111" stroke-width="4"/><polyline points="32 48 44 60 64 38" fill="none" stroke="#111" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></svg>';
                    subLine.innerHTML = '<strong>' + repo.name + '</strong> 下载已开始<br>请留意浏览器下载栏';
                    cancelBtn.disabled = true;
                    cancelBtn.textContent = '已完成';
                } else {
                    window.location.href = repo.url;
                }
            }

            function tick() {
                if (canceled) return;
                remain--;
                if (remain <= 0) {
                    countdownEl.textContent = '0';
                    ringEl.style.strokeDashoffset = CIRCUMFERENCE;
                    finish();
                    return;
                }
                countdownEl.textContent = remain;
                ringEl.style.strokeDashoffset = CIRCUMFERENCE * (1 - remain / TOTAL);
                setTimeout(tick, 1000);
            }

            setTimeout(tick, 1000);

            cancelBtn.addEventListener('click', function () {
                canceled = true;
                countdownEl.textContent = '—';
                ringEl.style.strokeDashoffset = CIRCUMFERENCE;
                this.textContent = '已取消';
                this.disabled = true;
            });
        })();
    </script>
</body>
</html>
